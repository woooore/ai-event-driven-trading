version: '3.8'

networks:
  trading-net:
    driver: bridge

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_HEAP_OPTS: "-Xmx128M -Xms64M"
    ports:
      - "2181:2181"
    networks:
      - trading-net

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xmx256M -Xms128M"
    networks:
      trading-net:
        aliases:
          - kafka

  redis:
    image: redis:7.0-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - trading-net

  core-trading-engine:
    build:
      context: ./core-trading-engine
      dockerfile: Dockerfile
    container_name: core-trading-engine
    depends_on:
      - kafka
      - redis
    ports:
      - "8080:8080"
    environment:
      KAFKA_SERVERS: kafka:29092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SIMULATION_MODE: "true"
      JAVA_TOOL_OPTIONS: "-Xmx384M -Xms128M"
    volumes:
      - engine-storage:/app/storage
    restart: always
    networks:
      - trading-net

  ai-signal-worker:
    build:
      context: ./ai-signal-worker
      dockerfile: Dockerfile
    container_name: ai-signal-worker
    depends_on:
      - kafka
    env_file:
      - ./ai-signal-worker/.env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    restart: always
    networks:
      - trading-net

volumes:
  redis-data:
  engine-storage:
