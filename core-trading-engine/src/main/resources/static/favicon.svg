<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="chart-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 배경 둥근 사각형 -->
  <rect width="64" height="64" rx="16" fill="url(#bg-grad)"/>
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- AI 서킷 / 그리드 미세 선 -->
  <path d="M12 48 L22 48 M42 48 L52 48" stroke="rgba(148,163,184,0.2)" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="22" cy="48" r="1.5" fill="#38bdf8" opacity="0.6"/>
  <circle cx="42" cy="48" r="1.5" fill="#a855f7" opacity="0.6"/>

  <!-- AI 볼텍스 / 번개 & 차트 상승 곡선 -->
  <path d="M14 42 L24 34 L34 38 L48 18" fill="none" stroke="url(#chart-grad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon-glow)"/>

  <!-- 차트 캔들 / 펄스 노드 -->
  <circle cx="14" cy="42" r="2.5" fill="#38bdf8"/>
  <circle cx="24" cy="34" r="2.5" fill="#60a5fa"/>
  <circle cx="34" cy="38" r="2.5" fill="#818cf8"/>
  
  <!-- 최고점 퀀트 로켓/다이아몬드 노드 -->
  <polygon points="48,13 53,18 48,23 43,18" fill="#f43f5e" filter="url(#neon-glow)"/>
  <circle cx="48" cy="18" r="1.5" fill="#ffffff"/>

  <!-- 우측 상단 번개 상승 심볼 -->
  <path d="M47 11 L54 11 L54 18" fill="none" stroke="#fb7185" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

